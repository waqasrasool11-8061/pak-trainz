<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Trainz | Photo Gallery</title>
    <link rel="icon" type="image/x-icon" href="Pictures & Videos/Pak-Trainz.jpg">
    <link rel="stylesheet" href="Pak-Trainz.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <img src="Pictures & Videos/Pak-Trainz.jpg" alt="Pak Trainz logo">
            <span>Pak Trainz</span>
        </a>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="store.html" style="background: rgba(37, 99, 235, 0.4); color: #fff; font-weight: bold;">🛒 Store</a>
            <a href="gallery.html" style="background: rgba(255,255,255,0.18);">Gallery</a>
            <a href="videos.html">Videos</a>
            <a href="/#downloads">Downloads</a>
            <a href="/#about">About</a>
            <a href="/#contact">Contact</a>
            <a href="admin.html" class="nav-admin-link">⚙️ Admin</a>
        </nav>
    </header>

    <main class="page">
        <section class="content-block">
            <div class="section-heading">
                <p class="eyebrow">Visual Showcase</p>
                <h2>Pakistan Railways Gallery</h2>
                <p>High-resolution screenshots of authentic Pakistan Railways locomotives, routes, and stations in Trainz. Click any image to view in full-screen.</p>
            </div>

            <div class="gallery" id="galleryGrid">
                <!-- Fallback items -->
                <figure class="gallery-item"><img src="Pictures & Videos/1.png" alt="Trainz photo 1"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/2.JPEG" alt="Trainz photo 2"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/3.png" alt="Trainz photo 3"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/4.png" alt="Trainz photo 4"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/5.png" alt="Trainz photo 5"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/6.png" alt="Trainz photo 6"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/7.png" alt="Trainz photo 7"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/8.png" alt="Trainz photo 8"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/9.png" alt="Trainz photo 9"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/10.png" alt="Trainz photo 10"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/11.png" alt="Trainz photo 11"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/12.png" alt="Trainz photo 12"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/13.png" alt="Trainz photo 13"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/14.png" alt="Trainz photo 14"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/15.png" alt="Trainz photo 15"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/16.png" alt="Trainz photo 16"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/17.png" alt="Trainz photo 17"></figure>
                <figure class="gallery-item"><img src="Pictures & Videos/18.png" alt="Trainz photo 18"></figure>
            </div>
        </section>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lightbox-close" aria-label="Close preview">×</button>
        <img id="lightboxImage" src="" alt="Expanded gallery image">
    </div>

    <script>
        let galleryImages = [];
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const closeButton = document.querySelector('.lightbox-close');
        let currentIndex = 0;

        function bindGalleryEvents() {
            galleryImages = Array.from(document.querySelectorAll('#galleryGrid img'));
            galleryImages.forEach((img, index) => {
                img.onclick = () => openLightbox(index);
            });
        }

        function openLightbox(index) {
            currentIndex = index;
            if (!galleryImages[currentIndex]) return;
            lightboxImage.src = galleryImages[currentIndex].src;
            lightboxImage.alt = galleryImages[currentIndex].alt;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function showNextImage(direction) {
            if (!lightbox.classList.contains('active')) return;
            const nextIndex = (currentIndex + direction + galleryImages.length) % galleryImages.length;
            openLightbox(nextIndex);
        }

        closeButton.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeLightbox();
            else if (event.key === 'ArrowRight') showNextImage(1);
            else if (event.key === 'ArrowLeft') showNextImage(-1);
        });

        // Dynamic fetch
        async function loadDynamicGallery() {
            try {
                const res = await fetch('/api/gallery');
                const data = await res.json();
                if (data.success && data.gallery && data.gallery.length > 0) {
                    const grid = document.getElementById('galleryGrid');
                    grid.innerHTML = data.gallery.map(item => `
                        <figure class="gallery-item">
                            <img src="${encodeURI(item.image_url)}" alt="${item.title || 'Trainz photo'}" loading="lazy">
                        </figure>
                    `).join('');
                }
            } catch (err) {
                console.log('Using default gallery fallback');
            }
            bindGalleryEvents();
        }

        document.addEventListener('DOMContentLoaded', loadDynamicGallery);
    </script>
</body>
</html>
